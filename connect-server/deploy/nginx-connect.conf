# Add this as a new server block in your nginx config (e.g.
# /etc/nginx/sites-available/connect.marryislam.org), then symlink it into
# sites-enabled and reload nginx. Assumes you already run certbot for TLS on
# marryislam.org and can add this subdomain to the same certificate (or
# request a new one with: certbot --nginx -d connect.marryislam.org).
#
# This proxies only the signaling WebSocket (/ws) and the TURN credential
# endpoint (/turn-credentials) to the Go service listening on 127.0.0.1:8091.
# The actual TURN/STUN server (UDP+TCP 3478, plus the relay port range) is a
# separate listener that the Go binary binds directly — nginx does not (and
# cannot usefully) proxy that part; it needs to be reachable directly from
# the internet, forwarded from your router straight to the Pi.

server {
    listen 443 ssl http2;
    server_name connect.marryislam.org;

    # ssl_certificate / ssl_certificate_key are typically injected here by
    # certbot automatically — leave them if certbot manages this file.

    location /ws {
        proxy_pass http://127.0.0.1:8091/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket connections should stay open for the whole call; the Go
        # server pings every ~55s to keep intermediaries from timing out, but
        # give it headroom in case the call runs long or the network is slow.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /turn-credentials {
        proxy_pass http://127.0.0.1:8091/turn-credentials;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8091/healthz;
    }
}

server {
    listen 80;
    server_name connect.marryislam.org;
    return 301 https://$host$request_uri;
}
